<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>Prácticas de Matemáticas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%231d4ed8%27/%3E%3Ctext x=%2750%27 y=%2768%27 font-size=%2752%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E%C3%B7%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="_comun/estilos.css">
  <style>
    /* Solo de la portada: las tareas de la semana, los bloques por semana y el pie con el panel. */
    .portada__unidad { margin-top: 1.4rem; }
    .portada__titulo-unidad { font-size: 1.3rem; font-weight: 700; margin: 0 0 .4rem; }
    details.portada__unidad { border: 1px solid var(--borde); border-radius: .6rem; padding: .3rem .9rem .9rem; }
    details.portada__unidad > summary { cursor: pointer; padding: .6rem 0; }
    .portada__bloque { font-size: 1.05rem; margin: 1.6rem 0 .6rem; }
    .portada__bloque--todas { font-size: 1.15rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--borde); }
    .portada__subbloque { font-size: .95rem; color: var(--texto-suave); margin: 1.2rem 0 .5rem; }
    .portada__estado { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .6rem; margin-top: .25rem; }
    .portada__plazo { font-size: .85rem; font-weight: 600; }
    .portada__plazo--fuera, .portada__plazo--tarde { color: var(--error); }
    .portada__plazo--entregada { color: var(--correcto); }
    .portada__pie { margin-top: 2rem; text-align: center; font-size: .85rem; }
    .portada__pie a { color: var(--texto-suave); display: inline-block; padding: .8rem 1rem; }
  </style>
  <script type="module" src="portada.js"></script>
</head>
<body>
  <header class="cabecera">
    <span class="cabecera__titulo" id="cabecera-titulo">Prácticas de Matemáticas</span>
    <div class="cabecera__usuario idiomas" id="idiomas" role="group" aria-label="Idioma / Language"></div>
  </header>
  <main id="app" class="app">
    <p class="cargando">Cargando…</p>
  </main>
  <noscript><p class="aviso">Esta aplicación necesita JavaScript.</p></noscript>
</body>
</html>
